name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:latest
    steps:
      - name: Check out package
        uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out package
        uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test

  lint:
    name: Lint and formatting
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out package
        uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Check formatting
        run: git ls-files -z -- '*.swift' | xargs -0 swift format lint --strict --configuration .swift-format
      - name: Check lint (including warnings)
        run: |
          swiftlint version
          git ls-files -z -- '*.swift' | xargs -0 swiftlint lint --strict --reporter github-actions-logging
