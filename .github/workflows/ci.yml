name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux, Swift 6.4
            container: swift:6.4
          - os: xcode-27
            name: macOS, Xcode 27
            container: ""
    steps:
      - name: Check out package
        uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Check out package
        uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Check lint (including warnings)
        run: |
          swiftlint version
          git ls-files -z -- '*.swift' | xargs -0 swiftlint lint --strict --reporter github-actions-logging

  format:
    name: Check formatting
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Check out package
        uses: actions/checkout@v7
      - name: Check formatting
        run: |
          swift --version
          git ls-files -z -- '*.swift' | xargs -0 swift format lint --strict --configuration .swift-format
